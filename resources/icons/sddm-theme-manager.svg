<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2233"/>
      <stop offset="100%" stop-color="#0f111a"/>
    </linearGradient>
    <linearGradient id="displayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24283b"/>
      <stop offset="100%" stop-color="#16161e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9e64"/>
      <stop offset="100%" stop-color="#f7768e"/>
    </linearGradient>
  </defs>

  <!-- Background base rounded card -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#3b4261" stroke-width="2.5"/>

  <!-- Monitor / Display Frame -->
  <rect x="22" y="24" width="84" height="54" rx="8" fill="url(#displayGrad)" stroke="#7aa2f7" stroke-width="2.5"/>

  <!-- Stand & Base -->
  <path d="M58 78 L54 94 L74 94 L70 78 Z" fill="#24283b" stroke="#3b4261" stroke-width="2"/>
  <rect x="44" y="94" width="40" height="5" rx="2.5" fill="#3b4261"/>

  <!-- Greeter Login Mockup Elements -->
  <!-- User Avatar Circle -->
  <circle cx="64" cy="44" r="8" fill="#7aa2f7" opacity="0.9"/>
  <!-- Password field box -->
  <rect x="46" y="58" width="36" height="8" rx="4" fill="#3b4261" stroke="#7aa2f7" stroke-width="1.2"/>
  <circle cx="56" cy="62" r="1.5" fill="#c0caf5"/>
  <circle cx="64" cy="62" r="1.5" fill="#c0caf5"/>
  <circle cx="72" cy="62" r="1.5" fill="#c0caf5"/>

  <!-- Theme Paintbrush / Palette Indicator -->
  <g transform="translate(76, 68)">
    <circle cx="22" cy="22" r="20" fill="#1f2335" stroke="#ff9e64" stroke-width="2.5"/>
    <!-- Palette Dots -->
    <circle cx="15" cy="16" r="3" fill="#f7768e"/>
    <circle cx="23" cy="12" r="3" fill="#7aa2f7"/>
    <circle cx="30" cy="18" r="3" fill="#9ece6a"/>
    <circle cx="26" cy="27" r="3.5" fill="#bb9af7"/>
    <circle cx="16" cy="28" r="3" fill="#e0af68"/>
    <!-- Thumb Hole -->
    <ellipse cx="20" cy="21" rx="2.5" ry="3" fill="#16161e"/>
  </g>
</svg>
